plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.1.3-beta.3'
group = 'nl.townsandkingdoms.streamcontrol'
base.archivesName = 'streams-flow-control'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
neoForge {
    version = '21.1.219'
    runs {
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx3G'
            gameDirectory = file('run')
            systemProperty 'streamcontrol.integrationTest', System.getProperty('streamcontrol.integrationTest', 'false')
        }
    }
    mods { streamcontrol { sourceSet sourceSets.main } }
}
dependencies {
    implementation files('libs/StreamsReflowing-1.21.1-neoforge-2.15.2.jar')
    // Optional local compatibility test fixtures, never included in the published jar.
    if (providers.gradleProperty('withUtf').isPresent()) {
        runtimeOnly files('libs/ultraterraforged-1.0.2+1.21.1-neoforge.jar',
            'libs/ultraterraforged-streams-currents-0.2.1-beta.jar')
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('jar') { from('LICENSE') }
